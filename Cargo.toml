[package]
name = "file-flier"
version = "0.3.1"
edition = "2024"
description = "A fast, keyboard-driven file manager for Linux, inspired by File Pilot"
license = "GPL-3.0-or-later"
repository = "https://github.com/andrew11155/FileFlier"

[dependencies]
chrono = "0.4.45"
dirs = "7.0.0"
eframe = { version = "0.35.0", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui = "0.35"
egui_extras = { version = "0.35", features = ["image", "file"] }
humansize = "2.1.3"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
libc = "0.2.189"
open = "5.4.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
trash = "5.2.9"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

[package]
name = "file-flier"
version = "0.7.0"
edition = "2024"
description = "A fast, keyboard-driven file manager for Linux and macOS, inspired by File Pilot"
license = "GPL-3.0-or-later"
repository = "https://github.com/andrew11155/File-Flier"

[dependencies]
chrono = "0.4.45"
dirs = "7.0.0"
eframe = { version = "0.35.0", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui = "0.35"
egui_extras = { version = "0.35", features = ["image", "file", "syntect"] }
humansize = "2.1.3"
image = { version = "0.25.10", default-features = false, features = [
    "png", "jpeg", "gif", "webp", "bmp", "tiff", "ico", "tga", "qoi", "pnm", "hdr", "exr", "dds",
] }
libc = "0.2.189"
ab_glyph = "0.2"
cfb = "0.15"
csv = "1.4"
flate2 = "1"
hayro = "0.7"
kamadak-exif = "0.6"
libloading = "0.9"
lofty = "0.25"
md-5 = "0.11"
png = "0.18"
quick-xml = "0.42"
resvg = "0.48"
tar = "0.4"
ttf-parser = "0.25"
zbus = "5"
zip = { version = "8.6", default-features = false, features = ["deflate-flate2"] }
open = "5.4.4"
raw-window-handle = "0.6"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11"
trash = "5.2.9"
ureq = { version = "3", default-features = false, features = ["rustls", "platform-verifier"] }

[target.'cfg(target_os = "linux")'.dependencies]
wayland-backend = { version = "0.3", features = ["client_system"] }
wayland-client = "0.31"
x11rb = "0.13"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std", "NSArray", "NSData", "NSError", "NSGeometry", "NSObject", "NSString", "NSURL",
] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std", "NSApplication", "NSDragging", "NSDraggingItem", "NSDraggingSession", "NSEvent", "NSImage",
    "NSPasteboard", "NSResponder", "NSView", "NSWorkspace", "block2",
] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[package]
name = "file-flier"
version = "0.5.0"
edition = "2024"
description = "A fast, keyboard-driven file manager for Linux, inspired by File Pilot"
license = "GPL-3.0-or-later"
repository = "https://github.com/andrew11155/FileFlier"

[dependencies]
chrono = "0.4.45"
dirs = "7.0.0"
eframe = { version = "0.35.0", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui = "0.35"
egui_extras = { version = "0.35", features = ["image", "file", "syntect"] }
humansize = "2.1.3"
image = { version = "0.25.10", default-features = false, features = [
    "png", "jpeg", "gif", "webp", "bmp", "tiff", "ico", "tga", "qoi", "pnm", "hdr", "exr", "dds",
] }
libc = "0.2.189"
ab_glyph = "0.2"
cfb = "0.15"
csv = "1.4"
flate2 = "1"
hayro = "0.7"
kamadak-exif = "0.6"
libloading = "0.9"
lofty = "0.25"
md-5 = "0.11"
png = "0.18"
quick-xml = "0.42"
resvg = "0.48"
tar = "0.4"
ttf-parser = "0.25"
zbus = "5"
zip = { version = "8.6", default-features = false, features = ["deflate-flate2"] }
open = "5.4.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
trash = "5.2.9"

[target.'cfg(target_os = "linux")'.dependencies]
raw-window-handle = "0.6"
wayland-backend = { version = "0.3", features = ["client_system"] }
wayland-client = "0.31"
x11rb = "0.13"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

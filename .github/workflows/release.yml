name: Release

# Builds installable packages. Runs on version tags (v*) and can be started by hand
# from the Actions tab; the packages are attached to the run, and to the GitHub
# release when triggered by a tag.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  flatpak:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-26.08
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: file-flier.flatpak
          manifest-path: flatpak/io.github.andrew11155.FileFlier.yml
          cache-key: flatpak-builder-${{ github.sha }}
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: file-flier.flatpak

  binary:
    # Built on an older glibc so the binary runs on current Fedora/Bazzite, Ubuntu, Arch, etc.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked
      - name: Package
        run: |
          dir=file-flier-x86_64-linux
          mkdir -p "$dir/assets"
          cp target/release/file-flier install.sh README.md "$dir/"
          cp assets/io.github.andrew11155.FileFlier.desktop assets/io.github.andrew11155.FileFlier.svg "$dir/assets/"
          tar czf "$dir.tar.gz" "$dir"
      - uses: actions/upload-artifact@v4
        with:
          name: file-flier-x86_64-linux
          path: file-flier-x86_64-linux.tar.gz
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: file-flier-x86_64-linux.tar.gz

  macos:
    # Universal "File Flier.app" as a .dmg (to install) and a .zip (for the in-app updater).
    # Signed and notarized when the MACOS_* / APPLE_* secrets are set (see README → Packaging).
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - run: scripts/macos-app.sh
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: file-flier-macos
          path: |
            dist/File-Flier.dmg
            dist/File-Flier-macos.zip
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/File-Flier.dmg
            dist/File-Flier-macos.zip

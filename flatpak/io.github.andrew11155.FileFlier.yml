# Flatpak manifest. Build and install locally with:
#   flatpak run org.flatpak.Builder --user --install --force-clean --install-deps-from=flathub \
#       build-dir flatpak/io.github.andrew11155.FileFlier.yml
id: io.github.andrew11155.FileFlier
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: file-flier

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # A file manager needs to see your files, removable drives (/run/media, /media, /mnt)
  # and the real trash in ~/.local/share/Trash.
  - --filesystem=host
  # Network shares and cloud accounts mounted by GNOME (smb://, sftp://, Google Drive).
  - --filesystem=xdg-run/gvfs
  - --filesystem=xdg-run/gvfsd
  # Mounting and safely ejecting USB drives and other disks, like other file managers.
  - --system-talk-name=org.freedesktop.UDisks2
  # "Open terminal here" needs to start the host's terminal, which requires
  # --talk-name=org.freedesktop.Flatpak. That lets an app run commands outside its
  # sandbox, so it's opt-in rather than granted here; the app explains how to enable it:
  #   flatpak override --user --talk-name=org.freedesktop.Flatpak io.github.andrew11155.FileFlier

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/file-flier/cargo
    CARGO_TERM_COLOR: never

modules:
  - name: file-flier
    buildsystem: simple
    build-commands:
      # Offline build: crates come from cargo-sources.json (regenerate it when Cargo.lock
      # changes, see README).
      - cargo --offline fetch --manifest-path Cargo.toml
      - cargo --offline build --release --locked
      - install -Dm755 target/release/file-flier /app/bin/file-flier
      - install -Dm644 assets/io.github.andrew11155.FileFlier.desktop /app/share/applications/io.github.andrew11155.FileFlier.desktop
      - install -Dm644 assets/io.github.andrew11155.FileFlier.svg /app/share/icons/hicolor/scalable/apps/io.github.andrew11155.FileFlier.svg
      - install -Dm644 assets/io.github.andrew11155.FileFlier.metainfo.xml /app/share/metainfo/io.github.andrew11155.FileFlier.metainfo.xml
    sources:
      - type: dir
        path: ..
        skip:
          - target
          - build-dir
          - .flatpak-builder
          - repo
          - '*.flatpak'
      - cargo-sources.json
